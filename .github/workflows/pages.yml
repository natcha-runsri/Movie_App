name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # macOS runner: ไฟล์ระบบไม่สนตัวพิมพ์เล็กใหญ่ เพราะ lib/ มี import ที่ตัวพิมพ์ไม่ตรงกับชื่อไฟล์
    # (เช่น 'homepage.dart' vs HomePage.dart, 'Morepage.dart' vs MorePage.dart)
    # ถ้าแก้ import ให้ตรงแล้ว เปลี่ยนเป็น ubuntu-latest ได้
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3 # Dart 3.7.2 ตรงกับ environment sdk ^3.7.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/Movie_App/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
